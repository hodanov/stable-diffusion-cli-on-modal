[project]
name = "stable-diffusion-modal-app"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
  "accelerate>=1.14.0",
  "controlnet-aux",
  "diffusers[torch]>=0.39.0",
  "facexlib>=0.3.0",
  "ftfy",
  "imageio",
  "imageio-ffmpeg",
  "invisible-watermark",  # To help viewers identify the images as machine-generated.
  "opencv-python-headless",  # Replaces the GUI build of opencv-python so the image needs no apt-installed libGL/libglib.
  "peft",
  "pillow",
  "pillow-avif-plugin",  # To save images in AVIF format.
  "pyyaml",  # To read the configuration file by written YAML.
  "safetensors>=0.8.0",  # To store tensors safely.
  "spandrel>=0.4.2",
  "torch>=2.12.1",
  "torchvision",  # Direct dependency so tool.uv.sources pins it to the cu130 index.
  "transformers>=5.12.1",
]

[tool.uv]
package = false
override-dependencies = [
  # Exclude the GUI build of opencv pulled in by invisible-watermark; opencv-python-headless provides cv2 instead.
  "opencv-python; sys_platform == 'never'",
]

# cu130: Blackwell GPUs (Modal "B200", sm_100) need CUDA 13 kernels, which
# cu126 wheels lack. Modal hosts run driver 580 / CUDA 13.0.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
