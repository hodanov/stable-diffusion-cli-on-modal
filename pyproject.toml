[project]
name = "stable-diffusion-modal-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "diffusers>=0.42.1",
    "huggingface-hub>=2.4.0",
    "modal>=1.6.3",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["cmd", "app"]
addopts = "--import-mode=importlib -ra"
